name: Build
run-name: Build - ${{ github.ref_name }}

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支、tag 或 commit SHA（留空则用默认分支）"
        required: false
        default: ""
        type: string

env:
  CI: "true"
  JAVA_DISTRIBUTION: "oracle"
  JAVA_VERSION: "17.0.1"
  ANDROID_API_LEVEL: "37"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  LOCAL_GRADLE_VERSION: "9.9.1"
  LOCAL_AGP_VERSION: "9.2.1"
  LOCAL_KOTLIN_VERSION: "2.2.10"
  CI_ABI: "arm64-v8a"
  RELEASE_DIR: app/build/outputs/apk/release
  ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}

concurrency:
  group: build-${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Set Timezone to Asia/Shanghai
        shell: bash
        run: |
          set -euo pipefail
          sudo timedatectl set-timezone Asia/Shanghai
          echo "Current time: $(date)"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}

      - name: Validate Project Toolchain Baseline
        shell: bash
        run: |
          set -euo pipefail

          grep -Eq '^distributionUrl=.*gradle-'"${LOCAL_GRADLE_VERSION//./\\.}"'-bin\.zip$' gradle/wrapper/gradle-wrapper.properties
          grep -Eq '^android-plugin = "'"${LOCAL_AGP_VERSION//./\\.}"'"$' gradle/libs.versions.toml
          grep -Eq '^kotlin = "'"${LOCAL_KOTLIN_VERSION//./\\.}"'"$' gradle/libs.versions.toml
          grep -Eq '^appVersion=.+' gradle.properties
          grep -Eq 'compileSdk = '"${ANDROID_API_LEVEL}"'$' app/build.gradle.kts
          grep -Eq 'buildToolsVersion = "'"${ANDROID_BUILD_TOOLS//./\\.}"'"$' app/build.gradle.kts
          grep -Eq 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -Eq 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          architecture: x64
          check-latest: false
          # 不启用 cache: gradle：它缓存的 ~/.gradle/caches 与 ~/.gradle/wrapper
          # 与下方 setup-gradle 完全重叠，会产生两份条目并争抢同一批 restore key。

      - name: Pin Gradle Java Home
        shell: bash
        run: |
          set -euo pipefail
          echo "ORG_GRADLE_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          # 保存前清理 Gradle User Home 中不再被引用的条目。缺了这一步，缓存会随
          # 依赖与 AGP 升级持续膨胀，逼近仓库 10 GB 配额时被整体淘汰，直接退回冷构建。
          cache-cleanup: on-success
          # cache-read-only 不显式指定：默认值按分支判定，默认分支可写、其余分支只读。

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print Toolchain Versions
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          java -version
          sdkmanager --version
          ./gradlew --version

      - name: Build Release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease -PciAbi="${CI_ABI}"

      - name: Collect APK
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_DIR}/app-${CI_ABI}-release.apk"
          if [[ ! -f "$expected" ]]; then
            echo "缺少预期产物 $expected，实际目录内容：" >&2
            ls -lh "${RELEASE_DIR}" >&2 || true
            exit 1
          fi
          # 防止 -PciAbi 失效后又悄悄产出多 ABI 包，掩盖配置回退。
          others=$(find "${RELEASE_DIR}" -maxdepth 1 -type f -name "*.apk" ! -name "app-${CI_ABI}-release.apk")
          if [[ -n "$others" ]]; then
            echo "除 $expected 外还产出了其他 APK，CI 应只构建单一 ABI：" >&2
            echo "$others" >&2
            exit 1
          fi
          ls -lh "$expected"
          {
            echo "apk=$expected"
            echo "name=app-${CI_ABI}-release.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Package Encrypted APK Artifact
        id: package_artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACT_PASSWORD}" ]]; then
            echo "ARTIFACT_PASSWORD is not set" >&2
            exit 1
          fi
          artifact_path="${RUNNER_TEMP}/Sesame-AG-unsigned-${GITHUB_SHA}.zip"
          (
            cd "${RELEASE_DIR}"
            zip -P "${ARTIFACT_PASSWORD}" "${artifact_path}" "${{ steps.collect.outputs.name }}"
          )
          ls -lh "${artifact_path}"
          echo "artifact_path=${artifact_path}" >> "$GITHUB_OUTPUT"

      - name: Upload Encrypted APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sesame-AG-unsigned-${{ github.sha }}
          path: ${{ steps.package_artifact.outputs.artifact_path }}
          if-no-files-found: error
          archive: false

      - name: Write Build Summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Build Summary"
            echo
            echo "- 触发: \`${{ github.event_name }}\`"
            echo "- 引用: \`${{ github.ref_name }}\`"
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 架构: \`${CI_ABI}\`（仅此单一 ABI）"
            echo "- 产物: \`${{ steps.collect.outputs.name }}\`"
            echo "- 说明: 内含未签名 APK，请自行使用 apksigner 签名后安装"
          } >> "$GITHUB_STEP_SUMMARY"
